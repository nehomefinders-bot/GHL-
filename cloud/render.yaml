# Render.com Blueprint - deploys the cloud scraper as a FREE Docker web service.
# In Render: New + -> Blueprint -> connect this repo -> it reads this file.
# (Render's free plan has no persistent disk, so CSVs live on the running
# instance - download them after each zip finishes.)
services:
  - type: web
    name: realtor-agent-scraper
    runtime: docker
    plan: free
    dockerfilePath: ./cloud/Dockerfile
    dockerContext: ./cloud
    autoDeploy: true
    envVars:
      - key: OUTPUT_DIR
        value: /app/outputs
      # To get past realtor.com's block from a cloud IP, set ONE provider (see
      # cloud/README.md). Add these in Render's dashboard as secrets, not here.
      # Easiest - a scraping API key:
      # - key: SCRAPER_API_KEY
      #   sync: false            # set the value in the Render dashboard
      # - key: SCRAPER_API_PROVIDER
      #   value: scraperapi      # or scrapingbee
      # Or a residential proxy:
      # - key: SCRAPER_PROXY
      #   sync: false            # http://user:pass@residential-proxy-host:port
