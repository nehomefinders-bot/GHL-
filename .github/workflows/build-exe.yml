name: Build Windows EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name RealtorAgentScraper realtor_agent_scraper.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtorAgentScraper
          path: dist/RealtorAgentScraper.exe
