name: Build Windows EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name RealtorAgentScraper realtor_agent_scraper.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtorAgentScraper
          path: dist/RealtorAgentScraper.exe

      - name: Commit exe to repo for easy download
        shell: pwsh
        run: |
          Copy-Item dist/RealtorAgentScraper.exe RealtorAgentScraper.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RealtorAgentScraper.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update RealtorAgentScraper.exe [skip ci]"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          } else {
            Write-Host "Exe unchanged, nothing to commit."
          }
          exit 0
