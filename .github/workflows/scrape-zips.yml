name: Scrape Realtor Zips

# Free cloud runs on GitHub's servers - no credit card, keeps running with your
# PC off. Ways to start it:
#   1) Edit cloud/zips.txt (put your zips, one per line) and commit -> auto-runs.
#   2) Actions tab -> Run workflow (if the button shows) and paste zips.
#   3) On a schedule (see the "schedule" block below - disabled by default).
#
# IMPORTANT: realtor.com blocks GitHub's datacenter IPs. To actually get data,
# add ONE repo secret (Settings -> Secrets and variables -> Actions):
#   - SCRAPER_API_KEY  (a scraping-API key: ScraperAPI / ScrapingBee) - easiest
#   - or SCRAPER_PROXY (a residential proxy: http://user:pass@host:port)
# Without one, every zip returns 0 agents. See cloud/README.md.
on:
  push:
    branches: ["**"]
    paths:
      - "cloud/zips.txt"
  workflow_dispatch:
    inputs:
      zips:
        description: "Zip codes (comma, space or newline separated)"
        required: true
        default: "30002"
      max_pages:
        description: "Max pages per zip (blank = all)"
        required: false
        default: ""
  # Uncomment to run automatically on a schedule (uses cloud/zips.txt). Only
  # worth enabling once you've set a provider secret, or it just writes empty
  # CSVs. Example below runs every Monday at 13:00 UTC (~9am US Eastern).
  # schedule:
  #   - cron: "0 13 * * 1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install selenium requests beautifulsoup4

      - name: Run scraper
        env:
          ZIPS: ${{ github.event.inputs.zips }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          OUTPUT_DIR: outputs
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          # ---- Unblock realtor.com (set ONE of these as a repo secret) ----
          # Scraping API (easiest): key + which provider it belongs to.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_PROVIDER: ${{ secrets.SCRAPER_API_PROVIDER }}   # scraperapi (default) | scrapingbee | custom
          SCRAPER_API_COUNTRY: ${{ secrets.SCRAPER_API_COUNTRY }}     # e.g. us
          # Residential proxy alternative:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python cloud/run_zips.py

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtor-csvs
          path: outputs/*.csv
          if-no-files-found: warn
