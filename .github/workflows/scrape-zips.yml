name: Scrape Realtor Zips

# Runs OUR headless-browser scraper on GitHub's servers. Ways to start it:
#   1) Edit cloud/zips.txt (your zips, one per line) and commit -> auto-runs.
#   2) Actions tab -> Run workflow (if the button shows) and paste zips.
#   3) On a schedule (see the "schedule" block below - disabled by default).
#
# IMPORTANT: GitHub's runners use datacenter IPs, which realtor.com blocks, so a
# run here returns 0 agents UNLESS you route it through a residential proxy:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: SCRAPER_PROXY   Value: http://user:pass@host:port   (US residential)
# Prefer no paid proxy? Run cloud/run_zips.py on your own PC / a home server
# instead - from a residential IP it works with no proxy. See cloud/README.md.
on:
  push:
    branches: ["**"]
    paths:
      - "cloud/zips.txt"
  workflow_dispatch:
    inputs:
      zips:
        description: "Zip codes (comma, space or newline separated)"
        required: true
        default: "30002"
      max_pages:
        description: "Max pages per zip (blank = all)"
        required: false
        default: ""
  # Uncomment to run automatically on a schedule (uses cloud/zips.txt). Only
  # worth enabling once you've set SCRAPER_PROXY, or it just writes empty CSVs.
  # Example: every Monday at 13:00 UTC (~9am US Eastern).
  # schedule:
  #   - cron: "0 13 * * 1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install selenium

      - name: Run scraper
        env:
          ZIPS: ${{ github.event.inputs.zips }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          OUTPUT_DIR: outputs
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          # Residential proxy (just an IP route; our code still does the scraping).
          # Needed to get data from GitHub's datacenter IP. Set as a repo secret.
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python cloud/run_zips.py

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtor-csvs
          path: outputs/*.csv
          if-no-files-found: warn
